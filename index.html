<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Party Beat Lights</title>
<style>
  :root {
    --bg: #0b0b14;
    --panel: #161626;
    --line: #2a2a40;
    --text: #f4f4fb;
    --muted: #9a9ab5;
    --a: #ff2bd6;
    --b: #00e5ff;
    --live: #ff2bd6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-size: 22px; margin: 4px 0 2px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
  button { font: inherit; color: var(--text); background: #23233a; border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; font-weight: 600; font-size: 16px; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .pill { width: 10px; height: 10px; border-radius: 50%; background: #555; display: inline-block; margin-right: 6px; }
  .pill.on { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }

  /* Game */
  #beatBtn { width: 100%; height: 42vh; min-height: 240px; border-radius: 28px; border: none;
    font-size: 34px; font-weight: 800; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.45);
    background: var(--live); box-shadow: 0 0 40px var(--live); transition: background .08s, box-shadow .08s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #beatBtn small { font-size: 15px; font-weight: 600; opacity: .9; }
  .gameColors { display: flex; gap: 10px; margin-top: 12px; }
  .gc { flex: 1; position: relative; border-radius: 14px; border: 2px solid var(--line); padding: 10px; display: flex; align-items: center; gap: 10px; background: #1c1c30; }
  .gc.active { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,.35); }
  .gc .sw { width: 34px; height: 34px; border-radius: 10px; flex: none; }
  .gc span { font-size: 14px; font-weight: 600; }
  .gc input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }

  /* Free color */
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .swatch { aspect-ratio: 1; border-radius: 14px; border: 2px solid transparent; padding: 0; }
  .swatch.custom { position: relative; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .targetRow { display: flex; gap: 8px; margin-bottom: 12px; }
  .targetRow button { flex: 1; font-size: 14px; padding: 10px 8px; }
  .targetRow button.sel { background: #fff; color: #111; }
  input[type=range] { width: 100%; accent-color: #ff2bd6; height: 32px; }
  .powerRow button { flex: 1; }
  .help { color: var(--muted); font-size: 13px; line-height: 1.45; }
  .help code { color: #fff; }

  /* Top bar + connection chip */
  .topbar { position: sticky; top: 0; z-index: 10; margin: calc(-12px - env(safe-area-inset-top)) -16px 14px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: rgba(11,11,20,.92);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .topbar h1 { margin: 0; font-size: 19px; }
  #chip { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  #chip .d { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #chip[data-s=off] { background: #3a1520; border-color: #7a2a3a; }
  #chip[data-s=off] .d { background: #ff4d6a; }
  #chip[data-s=busy] { background: #3a3015; border-color: #7a652a; }
  #chip[data-s=busy] .d { background: #ffc53d; animation: pulse 1s infinite; }
  #chip[data-s=on] { background: #15331f; border-color: #2a7a45; }
  #chip[data-s=on] .d { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  @keyframes pulse { 50% { opacity: .25; } }
  #msg { font-size: 13px; color: var(--muted); margin: -6px 0 12px; min-height: 0; }
  #msg:empty { display: none; }
  #beatBtn.offline { outline: 3px dashed rgba(255,255,255,.55); outline-offset: -8px; }

  /* Bottom sheet */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: none; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 22px 22px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); transform: translateY(105%); transition: transform .2s; }
  #sheet.open { transform: none; }
  #sheet h2 { font-size: 17px; margin: 0 0 4px; }
  #sheet p { color: var(--muted); font-size: 13px; margin: 0 0 14px; line-height: 1.4; }
  #sheet button { width: 100%; margin-bottom: 10px; }
  #sheet .danger { background: #3a1520; border-color: #7a2a3a; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🐧 Party Beat</h1>
  <button id="chip" data-s="off"><span class="d"></span><span id="chipText">Tap to connect</span></button>
</div>
<div id="msg"></div>

<div class="panel">
  <div class="label">Party Beat game</div>
  <button id="beatBtn">BEAT! <small id="beatSub">Tap to switch color</small></button>
  <div class="gameColors">
    <label class="gc active" id="gcA"><div class="sw" id="swA"></div><span>Color 1</span><input type="color" id="colorA"></label>
    <label class="gc" id="gcB"><div class="sw" id="swB"></div><span>Color 2</span><input type="color" id="colorB"></label>
  </div>
</div>

<div class="panel">
  <div class="label">Pick a color</div>
  <div class="targetRow">
    <button id="tLights" class="sel">Send to lights</button>
    <button id="tA">Set Color 1</button>
    <button id="tB">Set Color 2</button>
  </div>
  <div class="swatches" id="swatches"></div>
</div>

<div class="panel">
  <div class="label">Brightness <span id="briVal">100</span>%</div>
  <input type="range" id="bri" min="1" max="100" value="100">
  <div class="row powerRow" style="margin-top:10px">
    <button id="onBtn">On</button>
    <button id="offBtn">Off</button>
  </div>
</div>

<div class="panel help">
  Open this page in the <b>Bluefy</b> browser (Safari can't do Bluetooth). Close the DayBetter app and nRF Connect first: the strip accepts one connection at a time.
  <span id="wakeTip"></span>
</div>

<div id="scrim"></div>
<div id="sheet">
  <h2 id="sheetTitle">Lights</h2>
  <p id="sheetText"></p>
  <button id="sheetPrimary"></button>
  <button id="sheetSecondary" class="danger"></button>
  <button id="sheetCancel">Cancel</button>
</div>

<script>
// ---------- Protocol ----------
// Frame: A0 | cmd | len(payload+3) | payload | CRC16-MODBUS (little-endian)
function crc16modbus(bytes) {
  let crc = 0xFFFF;
  for (const b of bytes) {
    crc ^= b;
    for (let i = 0; i < 8; i++) crc = (crc & 1) ? (crc >>> 1) ^ 0xA001 : crc >>> 1;
  }
  return crc;
}
function frame(cmd, payload) {
  const body = [0xA0, cmd, payload.length + 3, ...payload];
  const c = crc16modbus(body);
  return new Uint8Array([...body, c & 0xFF, c >> 8]);
}
const CMD = { power: 0x11, bright: 0x13, color: 0x15 };

// Known DayBetter service families: E065 (yours) and E031 (documented model)
const u = n => '0000' + n.toString(16).padStart(4, '0') + '-0000-1000-8000-00805f9b34fb';
const FAMILIES = [
  { svc: u(0xe065), write: u(0xa065), notify: u(0xf065), adv: u(0xc065) },
  { svc: u(0xe031), write: u(0xa031), notify: u(0xf031), adv: u(0xc031) },
];

// ---------- Bluetooth ----------
const $ = id => document.getElementById(id);
let device = null, writeChar = null;
let wantConnected = false;      // user intent: stay connected
let state = 'off';              // off | connecting | on | reconnecting
let retryTimer = null, retryDelay = 1000, connectingNow = false;
// Latest pending values; sent when connected, kept through dropouts
const pending = { power: null, bright: null, color: null };
let sending = false;

function errText(e) {
  if (!e) return 'unknown error';
  if (typeof e === 'string') return e;
  return [e.name, e.message].filter(Boolean).join(': ') || String(e);
}
function say(t) { $('msg').textContent = t || ''; }

function setState(s, note) {
  state = s;
  const chip = $('chip');
  chip.dataset.s = s === 'on' ? 'on' : (s === 'off' ? 'off' : 'busy');
  $('chipText').textContent = {
    off: 'Tap to connect', connecting: 'Connecting…', on: 'Connected', reconnecting: 'Reconnecting…'
  }[s];
  $('beatBtn').classList.toggle('offline', s !== 'on');
  say(note);
  if (s === 'on') keepAwake(); else releaseWake();
}

async function pickDevice() {
  if (!navigator.bluetooth) { setState('off', 'Bluetooth not available here. Open this page in the Bluefy browser.'); return; }
  try {
    const d = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'P0' }],
      optionalServices: FAMILIES.flatMap(f => [f.svc, f.adv]),
    });
    if (device) device.removeEventListener('gattserverdisconnected', onDrop);
    device = d;
    device.addEventListener('gattserverdisconnected', onDrop);
    wantConnected = true;
    retryDelay = 1000;
    tryConnect('connecting');
  } catch (e) {
    if (e && e.name === 'NotFoundError') setState('off', '');
    else setState('off', 'Could not open the device list: ' + errText(e));
  }
}

async function tryConnect(label) {
  if (!device || !wantConnected || connectingNow) return;
  clearTimeout(retryTimer);
  connectingNow = true;
  setState(label, state === 'off' ? '' : $('msg').textContent);
  try {
    const server = await device.gatt.connect();
    let found = false, lastErr;
    for (const f of FAMILIES) {
      try {
        const svc = await server.getPrimaryService(f.svc);
        writeChar = await svc.getCharacteristic(f.write);
        try { const n = await svc.getCharacteristic(f.notify); await n.startNotifications(); } catch (_) {}
        found = true; break;
      } catch (e) { lastErr = e; }
    }
    if (!found) throw new Error('light service not found (' + errText(lastErr) + ')');
    if (!wantConnected) { try { device.gatt.disconnect(); } catch (_) {} return; }
    retryDelay = 1000;
    setState('on', '');
    pump();                          // flush anything tapped while offline
  } catch (e) {
    writeChar = null;
    scheduleRetry('Still trying… (' + errText(e) + '). Is another app connected to the strip?');
  } finally {
    connectingNow = false;
  }
}

function scheduleRetry(note) {
  if (!wantConnected) return;
  setState('reconnecting', note || '');
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => tryConnect('reconnecting'), retryDelay);
  retryDelay = Math.min(retryDelay * 2, 10000);
}

function onDrop() {
  writeChar = null;
  if (wantConnected) { retryDelay = 1000; scheduleRetry('Connection dropped. Reconnecting automatically.'); }
  else setState('off', '');
}

function disconnect() {
  wantConnected = false;
  clearTimeout(retryTimer);
  writeChar = null;
  try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (_) {}
  setState('off', 'Disconnected. The strip is free for other apps.');
}

// When you come back to the page (e.g. after the phone slept), retry right away
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (state === 'on') keepAwake();
    if (wantConnected && state !== 'on') { retryDelay = 1000; tryConnect('reconnecting'); }
  }
});

// ---------- Sending ----------
function setPending(key, val) { pending[key] = val; pump(); }
async function pump() {
  if (sending || !writeChar) return;
  sending = true;
  try {
    for (const key of ['power', 'bright', 'color']) {
      if (pending[key] === null || !writeChar) continue;
      const val = pending[key];
      const bytes = key === 'power' ? frame(CMD.power, [val ? 1 : 0])
                  : key === 'bright' ? frame(CMD.bright, [val])
                  : frame(CMD.color, hexToRgb(val));
      try {
        if (writeChar.writeValueWithResponse) await writeChar.writeValueWithResponse(bytes);
        else await writeChar.writeValue(bytes);
        if (pending[key] === val) pending[key] = null;   // keep it if a newer value arrived meanwhile
      } catch (e) {
        break;                       // keep pending; the reconnect logic will flush it
      }
    }
  } finally {
    sending = false;
    if (writeChar && (pending.power !== null || pending.bright !== null || pending.color !== null)) setTimeout(pump, 0);
  }
}
function sendColor(hex) { setPending('color', hex); }

// ---------- Screen wake lock ----------
let wakeLock = null;
async function keepAwake() {
  if (!('wakeLock' in navigator)) {
    $('wakeTip').textContent = ' For the party, set Settings → Display & Brightness → Auto-Lock to Never: if the phone locks, Bluetooth drops.';
    return;
  }
  try { if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
  catch (_) { $('wakeTip').textContent = ' For the party, set Auto-Lock to Never: if the phone locks, Bluetooth drops.'; }
}
function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (_) {} wakeLock = null; }

// ---------- Chip + sheet ----------
function openSheet(cfg) {
  $('sheetTitle').textContent = cfg.title;
  $('sheetText').textContent = cfg.text || '';
  const p = $('sheetPrimary'), s2 = $('sheetSecondary');
  p.style.display = cfg.primary ? '' : 'none';
  s2.style.display = cfg.secondary ? '' : 'none';
  if (cfg.primary) { p.textContent = cfg.primary[0]; p.onclick = () => { closeSheet(); cfg.primary[1](); }; }
  if (cfg.secondary) { s2.textContent = cfg.secondary[0]; s2.onclick = () => { closeSheet(); cfg.secondary[1](); }; }
  $('scrim').style.display = 'block';
  requestAnimationFrame(() => $('sheet').classList.add('open'));
}
function closeSheet() { $('sheet').classList.remove('open'); $('scrim').style.display = 'none'; }
$('scrim').onclick = closeSheet;
$('sheetCancel').onclick = closeSheet;

$('chip').onclick = () => {
  const name = (device && device.name) || 'the strip';
  if (state === 'off') {
    if (device) openSheet({ title: 'Connect', text: 'Reconnect to ' + name + ', or choose a different strip.',
      primary: ['Reconnect to ' + name, () => { wantConnected = true; retryDelay = 1000; tryConnect('connecting'); }],
      secondary: ['Choose a different strip', pickDevice] });
    else pickDevice();
  } else if (state === 'on') {
    openSheet({ title: 'Connected to ' + name, text: 'Disconnect to free the strip for the DayBetter app or nRF Connect.',
      primary: ['Switch to a different strip', () => { disconnect(); pickDevice(); }],
      secondary: ['Disconnect', disconnect] });
  } else {
    openSheet({ title: 'Reconnecting to ' + name, text: 'The page keeps trying in the background. Taps on BEAT! are remembered and sent when it reconnects.',
      primary: ['Try again now', () => { retryDelay = 1000; tryConnect('reconnecting'); }],
      secondary: ['Stop and disconnect', disconnect] });
  }
};

// ---------- Colors ----------
function hexToRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
function load(k, d) { try { return localStorage.getItem(k) || d; } catch (_) { return d; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }

let colorA = load('pb_colorA', '#ff2bd6');
let colorB = load('pb_colorB', '#00e5ff');
let current = 'A';
let target = 'lights';

function renderGame() {
  $('colorA').value = colorA; $('colorB').value = colorB;
  $('swA').style.background = colorA; $('swB').style.background = colorB;
  const live = current === 'A' ? colorA : colorB;
  document.documentElement.style.setProperty('--live', live);
  $('gcA').classList.toggle('active', current === 'A');
  $('gcB').classList.toggle('active', current === 'B');
  $('beatSub').textContent = 'Now: Color ' + (current === 'A' ? '1' : '2') + '. Tap to switch';
}

// Photosensitivity guard: at most ~2.5 color changes per second (under the 3 flashes/sec guideline)
const MIN_SWITCH_MS = 400;
let lastSwitch = 0;
$('beatBtn').addEventListener('click', () => {
  const now = Date.now();
  if (now - lastSwitch < MIN_SWITCH_MS) return;
  lastSwitch = now;
  current = current === 'A' ? 'B' : 'A';
  renderGame();
  sendColor(current === 'A' ? colorA : colorB);
});

$('colorA').addEventListener('input', e => { colorA = e.target.value; save('pb_colorA', colorA); renderGame(); if (current === 'A') sendColor(colorA); });
$('colorB').addEventListener('input', e => { colorB = e.target.value; save('pb_colorB', colorB); renderGame(); if (current === 'B') sendColor(colorB); });

// Swatches
const PRESETS = ['#ff0000', '#ff6a00', '#ffd400', '#00ff3c', '#00e5ff',
                 '#0040ff', '#8a2bff', '#ff2bd6', '#ffffff'];
const sw = $('swatches');
PRESETS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'swatch'; b.style.background = c; b.setAttribute('aria-label', c);
  b.addEventListener('click', () => pick(c));
  sw.appendChild(b);
});
const custom = document.createElement('label');
custom.className = 'swatch custom';
custom.innerHTML = '<input type="color" value="#ff2bd6" aria-label="Custom color">';
custom.querySelector('input').addEventListener('input', e => pick(e.target.value));
sw.appendChild(custom);

function pick(c) {
  if (target === 'A') { colorA = c; save('pb_colorA', c); renderGame(); if (current === 'A') sendColor(c); }
  else if (target === 'B') { colorB = c; save('pb_colorB', c); renderGame(); if (current === 'B') sendColor(c); }
  else sendColor(c);
}
function setTarget(t) {
  target = t;
  $('tLights').classList.toggle('sel', t === 'lights');
  $('tA').classList.toggle('sel', t === 'A');
  $('tB').classList.toggle('sel', t === 'B');
}
$('tLights').onclick = () => setTarget('lights');
$('tA').onclick = () => setTarget('A');
$('tB').onclick = () => setTarget('B');

// Brightness & power
let briTimer = null;
$('bri').addEventListener('input', e => {
  const v = +e.target.value; $('briVal').textContent = v;
  clearTimeout(briTimer);
  briTimer = setTimeout(() => setPending('bright', v), 60);
});
$('onBtn').onclick = () => setPending('power', 1);
$('offBtn').onclick = () => setPending('power', 0);

renderGame();
setState('off', '');
</script>
</body>
</html>
